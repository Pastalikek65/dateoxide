name: Release Wheels & Crates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-wheels:
    name: Build Wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
      - name: Smoke test native abi3 wheel on Windows x64 (Python 3.9 & 3.13)
        if: matrix.os == 'windows-latest'
        run: |
          py -3.9 -m pip install --force-reinstall dist/*.whl || python -m pip install --force-reinstall dist/*.whl
          python -c "import dateoxide; assert dateoxide.parse('2026-05-15 12:00', settings={'TIMEZONE': 'Europe/Berlin', 'RETURN_AS_TIMEZONE_AWARE': True}) is not None"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist

  build-sdist:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  smoke-test-abi3:
    name: Smoke Test Wheels on Python 3.9 & 3.13
    needs: [build-wheels]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
            artifact: wheels-ubuntu-latest-x86_64-auto
          - os: ubuntu-latest
            python: "3.13"
            artifact: wheels-ubuntu-latest-x86_64-auto
          - os: windows-latest
            python: "3.9"
            artifact: wheels-windows-latest-x64-native
          - os: windows-latest
            python: "3.13"
            artifact: wheels-windows-latest-x64-native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - run: |
          python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', *glob.glob('dist/*.whl')])"
          python -c "import dateoxide; assert dateoxide.parse('2026-05-15 12:00', settings={'TIMEZONE': 'Europe/Berlin', 'RETURN_AS_TIMEZONE_AWARE': True}) is not None"

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, build-sdist, smoke-test-abi3]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dateoxide
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-crates:
    name: Publish dateoxide-core to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io (if CARGO_REGISTRY_TOKEN is set)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo publish -p dateoxide-core --token "$CARGO_REGISTRY_TOKEN"
          else
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish."
          fi
