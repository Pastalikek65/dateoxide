name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p dateoxide-core --release
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check -p dateoxide-core --no-default-features

  python-wheels:
    name: Build & Test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install maturin pytest dateparser hijridate
      - run: maturin build --release --out dist -i python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      - run: python -c "import glob, subprocess, sys; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', *glob.glob('dist/*.whl')])"
      - run: pytest -v
