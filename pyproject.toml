[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "dateoxide"
version = "0.5.0"
description = "Blazing-fast, low-memory, multilingual natural-language date parser written in Rust — a drop-in accelerator for Python's dateparser."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["date", "datetime", "parser", "dateparser", "rust", "multilingual", "nlp", "fast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/Pastalikek65/dateoxide"
Repository = "https://github.com/Pastalikek65/dateoxide"
Issues = "https://github.com/Pastalikek65/dateoxide/issues"

[project.optional-dependencies]
dev = [
    "maturin>=1.7",
    "pytest>=8.0",
    "dateparser>=1.2",
    "psutil>=6.0",
]

[tool.maturin]
manifest-path = "crates/dateoxide-py/Cargo.toml"
python-source = "python"
module-name = "dateoxide._dateoxide"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
