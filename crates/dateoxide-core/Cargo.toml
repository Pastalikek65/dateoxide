[package]
name = "dateoxide-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/Pastalikek65/dateoxide"
documentation = "https://docs.rs/dateoxide-core"
readme = "../../README.md"
description = "High-performance, low-memory multilingual natural-language date parser core in Rust."
keywords = ["date", "datetime", "parser", "multilingual", "nlp"]
categories = ["date-and-time", "internationalization", "parsing", "text-processing"]

[features]
default = ["rayon", "calendars"]
rayon = ["dep:rayon"]
calendars = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
postcard = { version = "1.1", features = ["alloc"] }
rayon = { version = "1.10", optional = true }
regex = "1.11"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "parse_bench"
harness = false
