[package]
name = "dateoxide-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance, low-memory multilingual natural-language date parser core in Rust."

[dependencies]
aho-corasick = "1.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
postcard = { version = "1.1", features = ["alloc"] }
rayon = "1.10"
regex = "1.11"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"
